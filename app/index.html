<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Migraine Days Log</title>
<meta name="description" content="Log a migraine day in ten seconds. Your entries stay on this device.">
<meta name="theme-color" content="#1b120e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <h1>Migraine Days Log</h1>
  <span id="demoTag" class="demo" hidden>DEMO DATA</span>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabs" aria-label="Sections">
  <button data-tab="today">Today</button>
  <button data-tab="calendar">Calendar</button>
  <button data-tab="numbers">Numbers</button>
  <button data-tab="report">Report</button>
  <button data-tab="more">More</button>
</nav>
<script src="counts.js"></script>
<script src="app.js"></script>
</body>
</html>
